<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT - Game Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0c10; color: #fff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 2px solid #1f2833; }
        .logo { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-size: 1.8rem; }
        .wallet-box { background: #1f2833; padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 10px; border: 1px solid #45f3ff; }
        .add-btn { background: #00ffcc; border: none; color: #000; padding: 3px 10px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin: 20px 0; }
        .tab-btn { flex: 1; padding: 12px; background: #1f2833; border: 1px solid #333; color: #fff; font-size: 1rem; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #00ffcc; color: #000; font-weight: bold; box-shadow: 0 0 15px #00ffcc; border-color: #00ffcc; }
        .game-section { background: #151922; padding: 20px; border-radius: 12px; border: 1px solid #232936; }
        .hidden { display: none !important; }
        .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.1rem; color: #c5c6c7; }
        .timer { font-size: 2.2rem; font-weight: bold; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        .color-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .bet-btn { padding: 18px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .neon-black { background: #000; color: #fff; border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .neon-white { background: #ffffff; color: #000; box-shadow: 0 0 15px #ffffff; }
        .neon-purple { background: #8a2be2; color: #fff; box-shadow: 0 0 15px #8a2be2; }
        .bet-btn:disabled { background: #222 !important; color: #555 !important; box-shadow: none !important; border: none !important; cursor: not-allowed; }
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; padding: 5px; background: #0b0c10; border-radius: 8px; }
        .num-btn { padding: 10px; background: #1f2833; border: 1px solid #444; color: #fff; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .num-btn:disabled { background: #111; color: #444; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display:flex; justify-content:center; align-items:center; z-index:100; }
        .modal-content { background:#1f2833; padding:25px; border-radius:15px; width:90%; max-width:400px; text-align:center; border: 2px solid #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        .close-btn { float:right; font-size:1.8rem; cursor:pointer; color:#ff0055; }
        .qr-placeholder { background:#fff; padding: 15px; margin:15px 0; border-radius:10px; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .modal input { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #444; background:#0b0c10; color:#fff; font-size:1rem; }
        .submit-btn { width:100%; padding:12px; background:#00ffcc; border:none; border-radius:8px; font-size:1.1rem; font-weight:bold; cursor:pointer; margin-top:5px; }
        .history-title { margin-top: 15px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="logo">GT GAME</h1>
        <div class="wallet-box">
            <span>🪙 Wallet: <b id="wallet-balance">₹500</b></span>
            <button class="add-btn" onclick="openDepositModal()">+ Add</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="btn-color" onclick="switchGame('color-game')">Color Match</button>
        <button class="tab-btn" id="btn-number" onclick="switchGame('number-game')">Number Lock</button>
    </div>

    <main id="color-game" class="game-section">
        <div class="info-bar">
            <p>Period ID: <span id="color-round">Loading...</span></p>
            <div class="timer" id="color-timer">00:60</div>
        </div>
        <div class="color-grid">
            <button class="bet-btn neon-black" onclick="placeBet('color', 'Black')">Black (2.9x)</button>
            <button class="bet-btn neon-white" onclick="placeBet('color', 'White')">White (2.9x)</button>
            <button class="bet-btn neon-purple" onclick="placeBet('color', 'Purple')">Purple (2.9x)</button>
        </div>
        <p class="history-title">Last Results: <span id="color-history">-</span></p>
    </main>

    <main id="number-game" class="game-section hidden">
        <div class="info-bar">
            <p>Period ID: <span id="number-round">Loading...</span></p>
            <div class="timer" id="number-timer">60:00</div>
        </div>
        <p style="color: #bbb; margin-bottom: 10px;">Select any number from 00 to 99 (90x Reward):</p>
        <div class="number-grid" id="number-buttons-container"></div>
        <p class="history-title">Last Number: <span id="number-history">-</span></p>
    </main>

    <div id="deposit-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDepositModal()">&times;</span>
            <h2>Add Real Money</h2>
            <p>Scan QR & Pay, then enter UTR number</p>
            
            <div class="qr-placeholder">
                <img src="https://postimg.cc" alt="UPI QR" style="width:160px; height:160px; margin-bottom:10px; border: 1px solid #ccc; border-radius: 8px;">
                <p style="color:#000; font-weight:bold; font-size:0.9rem; word-break: break-all;">UPI ID: bambambholebaba570-1@okhdfcbank</p>
            </div>
            
            <input type="number" id="deposit-amount" placeholder="Enter Amount (₹)">
            <input type="text" id="utr-input" placeholder="Enter 12-Digit UTR Number">
            <button class="submit-btn" onclick="submitDeposit()">Submit Request</button>
        </div>
    </div>

    <!-- लाइव सॉकेट लाइब्रेरी कनेक्शन -->
    <script src="https://cloudflare.com"></script>
    <script>
        const socket = io();

        function switchGame(gameId) {
            document.querySelectorAll('.game-section').forEach(sec => sec.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(gameId).classList.remove('hidden');
            
            if (gameId === 'color-game') {
                document.getElementById('btn-color').classList.add('active');
            } else {
                document.getElementById('btn-number').classList.add('active');
            }
        }

        const numContainer = document.getElementById('number-buttons-container');
        for (let i = 0; i < 100; i++) {
            let numStr = String(i).padStart(2, '0');
            let btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = numStr;
            btn.onclick = function() { placeBet('number', numStr); };
            numContainer.appendChild(btn);
        }

        socket.on('color_timer_update', function(data) {
            const timerEl = document.getElementById('color-timer');
            timerEl.innerText = "00:" + (data.time < 10 ? '0' : '') + data.time;
            document.getElementById('color-round').innerText = data.roundId;

            const colorBtns = document.querySelectorAll('#color-game .bet-btn');
            if (data.freeze) {
                colorBtns.forEach(function(btn) { btn.disabled = true; });
                timerEl.style.color = '#ff0055';
            } else {
                colorBtns.forEach(function(btn) { btn.disabled = false; });
                timerEl.style.color = '#00ffcc';
            }
        });

        socket.on('number_timer_update', function(data) {
            const min = Math.floor(data.time / 60);
            const sec = data.time % 60;
            document.getElementById('number-timer').innerText = (min < 10 ? '0' : '') + min + ":" + (sec < 10 ? '0' : '') + sec;
            document.getElementById('number-round').innerText = data.roundId;

            const numBtns = document.querySelectorAll('.num-btn');
            if (data.freeze) {
                numBtns.forEach(function(btn) { btn.disabled = true; });
            } else {
                numBtns.forEach(function(btn) { btn.disabled = false; });
            }
        });

        function placeBet(gameType, selection) {
            const amount = prompt("दर्ज करें कि आप " + selection + " पर कितने रुपये लगाना चाहते हैं:", "10");
            if (!amount || isNaN(amount) || amount <= 0) return alert("कृपया सही राशि डालें!");

            fetch('/api/place-bet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gameType: gameType, selection: selection, amount: amount })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if(data.success) {
                    alert("सफलतापूर्वक ₹" + amount + " की बेट " + selection + " पर लग गई!");
                } else {
                    alert("बेट लग गई है");
                }
            });
        }

        socket.on('color_result', function(data) {
            document.getElementById('color-history').innerText = data.win;
            alert("🎯 कलर राउंड समाप्त! विजेता रंग है: " + data.win);
        });

        socket.on('number_result', function(data) {
            document.getElementById('number-history').innerText = data.win;
            alert("🎯 नंबर राउंड समाप्त! विजेता नंबर है: " + data.win);
        });

        function openDepositModal() { document.getElementById('deposit-modal').classList.remove('hidden'); }
        function closeDepositModal() { document.getElementById('deposit-modal').classList.add('hidden'); }

        function submitDeposit() {
            const amount = document.getElementById('deposit-amount').value;
            const utr = document.getElementById('utr-input').value;
            if(!amount || utr.length !== 12) return alert("कृपया सही राशि और 12-अंकों का UTR नंबर डालें!");
            alert("आपकी ₹" + amount + " की रिक्वेस्ट (UTR: " + utr + ") एडमिन के पास भेज दी गई है। जांच के बाद बैलेंस ऐड हो जाएगा।");
            closeDepositModal();
        }
    </script>
</body>
</html>
